name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      # URL 与 Client ID 均为公开配置。仓库变量可覆盖默认生产值；
      # BANGUMI_CLIENT_SECRET 只存在于私有 OA 服务，绝不进入 Actions。
      - name: 构建 release APK
        env:
          ABANGUMI_AUTH_BASE_URL: ${{ vars.ABANGUMI_AUTH_BASE_URL || 'https://api.anjila.icu' }}
          ABANGUMI_CLIENT_ID: ${{ vars.ABANGUMI_CLIENT_ID || 'bgm69386a8765324f840' }}
        run: |
          flutter build apk --release \
            --dart-define=ABANGUMI_AUTH_BASE_URL="${ABANGUMI_AUTH_BASE_URL}" \
            --dart-define=ABANGUMI_CLIENT_ID="${ABANGUMI_CLIENT_ID}"

      - name: 发布到 Releases
        uses: ncipollo/release-action@v1
        with:
          tag: v1.2.0
          name: aBangumi v1.2.0
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          allowUpdates: true
          bodyFile: docs/updates/1.2.0.md
